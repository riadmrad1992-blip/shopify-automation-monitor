name: Automation monitor
on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17 (off the busy top of the hour)
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the daily Slack digest now"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: Check all automations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DIGEST: ${{ inputs.send_digest }}
        run: |
          if [ "$DIGEST" = "true" ]; then python monitor.py --digest; else python monitor.py; fi
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - name: Alert Slack if the monitor itself failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\":rotating_light: *Automation monitor run failed.* Details: $RUN_URL\"}" "$SLACK_WEBHOOK_URL"
          fi

  deploy:
    needs: check
    if: always() && needs.check.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
